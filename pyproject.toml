[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-auction-engine"
version = "0.1.0"
description = "League-specific salary-cap fantasy football draft optimizer"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "PyYAML>=6.0",
  "scipy>=1.13",
  "streamlit>=1.37",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
