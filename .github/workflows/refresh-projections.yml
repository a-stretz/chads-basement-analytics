name: Refresh 2026 projections

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/pull_projections.R
      - .github/workflows/refresh-projections.yml

jobs:
  projections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install ffanalytics dependencies
        run: |
          Rscript -e 'install.packages(c("data.table","readxl","httr2","rvest","purrr","tidyr","dplyr","rrapply","readr"), repos="https://packagemanager.posit.co/cran/__linux__/noble/latest")'
      - name: Install ffanalytics from public repository
        run: |
          git clone --depth 1 https://github.com/FantasyFootballAnalytics/ffanalytics.git /tmp/ffanalytics
          R CMD INSTALL /tmp/ffanalytics
      - name: Pull projections
        run: Rscript scripts/pull_projections.R
      - uses: actions/upload-artifact@v4
        with:
          name: projections-2026
          path: |
            data/processed/projections_2026.csv
            data/processed/projection_source_summary_2026.csv
